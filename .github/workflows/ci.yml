name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest server/test_server.py -v
      - name: Build server container
        run: docker build --tag ai-passport-recorder-server:test server

  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v5
      - name: Build firmware
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target esp32c3
          idf.py build
