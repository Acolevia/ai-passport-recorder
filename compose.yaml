services:
  recorder-server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${AI_PASSPORT_PORT:-8080}:8080"
    environment:
      AI_PASSPORT_UPLOAD_TOKEN: "${AI_PASSPORT_UPLOAD_TOKEN:?set AI_PASSPORT_UPLOAD_TOKEN}"
      AI_PASSPORT_MAX_UPLOAD_BYTES: "${AI_PASSPORT_MAX_UPLOAD_BYTES:-67108864}"
    volumes:
      - passport-recordings:/data

volumes:
  passport-recordings:
