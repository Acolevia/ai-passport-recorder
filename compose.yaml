services:
  recorder-server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${FOLO_PORT:-8080}:8080"
    environment:
      FOLO_UPLOAD_TOKEN: "${FOLO_UPLOAD_TOKEN:?set FOLO_UPLOAD_TOKEN}"
      FOLO_MAX_UPLOAD_BYTES: "${FOLO_MAX_UPLOAD_BYTES:-67108864}"
    volumes:
      - folo-recordings:/data

volumes:
  folo-recordings:
